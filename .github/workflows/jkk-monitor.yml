name: JKK Koto-ku vacancy monitor

on:
  # Triggered every 5 minutes by cron-job.org via the GitHub API.
  # GitHub's own cron scheduler is unreliable for short intervals.
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug run: save page HTML/screenshots as a downloadable artifact"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jkk-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: TELEGRAM_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (python pkg)
        run: pip install playwright

      # Cache the downloaded Chromium so we don't re-download it every run.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}

      - name: Install Chromium (only on cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      # System libs Chromium needs. Fast; safe to run every time.
      - name: Install system deps
        run: python -m playwright install-deps chromium

      - name: Run monitor
        env:
          JKK_WARD: "江東区"
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            python jkk_monitor.py --debug --test-notify
          else
            python jkk_monitor.py --test-notify
          fi

      - name: Upload debug files (only on debug runs)
        if: ${{ inputs.debug == true }}
        uses: actions/upload-artifact@v4
        with:
          name: jkk-debug
          path: debug/
          if-no-files-found: ignore
